# .github/workflows/check.yaml
name: check-package

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::devtools
          needs: check

      - name: Run `devtools::check()` and get coverage
        run: |
          # Run package tests
          devtools::check()

          # Compute and print code coverage locally to the build log
          cov <- covr::package_coverage()
          print(cov)
        shell: Rscript {0}
